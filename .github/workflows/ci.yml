name: TaskAnalyzer CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes Python
        run: python -m pytest tests/test_harness.py -v

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagem Docker
        run: docker compose build

      - name: Executar testes no Docker
        run: docker compose run --rm test-harness
